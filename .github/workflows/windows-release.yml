name: Build and release TGLite for Windows

on:
  push:
    branches: [main]
    paths:
      - 'Build.WinUI.ps1'
      - 'Telegram/**'
      - 'Telegram.WinUI.slnx'
      - 'Libraries/**'
      - '.github/workflows/windows-release.yml'
      - 'scripts/ci/**'
      - 'scripts/TdlibSmoke/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tglite-windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 330
    env:
      TG_API_ID: ${{ secrets.API_ID }}
      TG_API_HASH: ${{ secrets.API_HASH }}
      TG_PFX_B64: ${{ secrets.PFX }}
      TG_PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      TGLITE_PACKAGE_VERSION: 1.0.${{ github.run_number }}.0
      TGLITE_RELEASE_TAG: v1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      VCPKG_ROOT: C:\vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Check toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $installer -latest -prerelease -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs -or $vs -notmatch 'Microsoft Visual Studio[\\/]18') { throw 'Visual Studio 2026 is required.' }
          Write-Host "Visual Studio: $vs"
          cmake --version
          php --version
          if (-not (Test-Path 'Libraries/tdlib/CMakeLists.txt')) { throw 'TDLib submodule is missing.' }
          if (-not (Test-Path 'C:\vcpkg\.vcpkg-root')) { throw 'vcpkg is missing from the Windows runner.' }

      - name: Check source
        shell: pwsh
        run: |
          node --check scripts/apply-lite.mjs
          node --check scripts/verify-lite.mjs
          node scripts/verify-lite.mjs .

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check C# and XAML
        shell: pwsh
        run: dotnet run --project scripts/SyntaxCheck/SyntaxCheck.csproj --configuration Release -- .

      - name: Compile TDLib integration tester
        shell: pwsh
        run: dotnet build scripts/TdlibSmoke/TdlibSmoke.csproj --configuration Release --nologo

      - name: Prepare Telegram credentials and signing certificate
        shell: pwsh
        run: .\scripts\ci\prepare-windows.ps1

      - name: Validate code signing before compiling native dependencies
        shell: pwsh
        run: .\scripts\ci\verify-code-signing.ps1

      - name: Validate package publisher and MSBuild settings
        shell: pwsh
        run: .\scripts\ci\preflight-windows.ps1

      - name: Restore vcpkg downloaded archives
        uses: actions/cache/restore@v4
        id: downloads-cache
        with:
          path: C:\vcpkg\downloads
          key: tglite-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            tglite-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-

      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries/tdjson/x64-windows
            vcpkg_installed/x64-windows
          key: tglite-native-windows-x64-${{ hashFiles('vcpkg.json', 'Libraries/tdjson/build.ps1', 'scripts/upstream-ref.txt') }}

      - name: Restore TDLib schema and verify native files
        shell: pwsh
        run: .\scripts\ci\prepare-tdlib-artifacts.ps1

      - name: Configure verified GitHub source archive mirrors
        shell: pwsh
        run: .\scripts\ci\configure-vcpkg-sources.ps1

      - name: Install TDLib code-generation tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install gperf --version=3.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install GNU gperf.' }
          gperf --version
          if ($LASTEXITCODE -ne 0) { throw 'GNU gperf is unavailable.' }

      - name: Build TDLib (Windows x64)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location Libraries/tdjson
          try {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                .\build.ps1 -arch x64 -target windows
                break
              }
              catch {
                if ($attempt -eq 3) { throw }
                Write-Warning "TDLib dependency preparation was interrupted. Retrying attempt $($attempt + 1) of 3."
                Start-Sleep -Seconds (15 * $attempt)
              }
            }
          }
          finally { Pop-Location }

      - name: Store downloaded archives
        if: always() && steps.downloads-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\downloads
          key: tglite-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Store native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries/tdjson/x64-windows
            vcpkg_installed/x64-windows
          key: tglite-native-windows-x64-${{ hashFiles('vcpkg.json', 'Libraries/tdjson/build.ps1', 'scripts/upstream-ref.txt') }}

      - name: Verify TDLib generated schema and dependencies
        shell: pwsh
        run: .\scripts\ci\prepare-tdlib-artifacts.ps1

      - name: Verify TDLib native library and JSON API
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path Libraries/tdjson/x64-windows);$env:PATH"
          dotnet run --no-build --project scripts/TdlibSmoke/TdlibSmoke.csproj --configuration Release -- --native-only

      - name: Exercise Telegram test DC authorization and Saved Messages
        id: testdc
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path Libraries/tdjson/x64-windows);$env:PATH"
          dotnet run --no-build --project scripts/TdlibSmoke/TdlibSmoke.csproj --configuration Release

      - name: Restore and verify TON wallet runtime
        shell: pwsh
        run: .\scripts\ci\prepare-wallet-engine.ps1

      - name: Build signed MSIXBundle
        shell: pwsh
        run: .\Build.WinUI.ps1 -Platform x64 -Configuration Release -Identity Bundle

      - name: Verify and prepare Release assets
        shell: pwsh
        run: .\scripts\ci\verify-windows-package.ps1

      - name: Install and launch packaged application on Windows
        shell: pwsh
        env:
          TGLITE_TEST_DC_STATUS: ${{ steps.testdc.outcome }}
        run: .\scripts\ci\test-install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: tglite-windows-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path release -File | ForEach-Object { $_.FullName })
          if ($files.Count -lt 4) { throw 'Release files are incomplete.' }
          gh release create $env:TGLITE_RELEASE_TAG @files --target $env:GITHUB_SHA --title "TGLite $env:TGLITE_PACKAGE_VERSION" --notes-file docs/RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

      - name: Remove sensitive files
        if: always()
        shell: pwsh
        run: |
          Remove-Item 'Telegram/Constants.Secret.cs' -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'tglite-signing.pfx') -Force -ErrorAction SilentlyContinue
