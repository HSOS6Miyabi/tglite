name: Prepare TGLite source

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/assemble-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tglite-prepare-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import pinned Unigram source
        shell: bash
        run: |
          set -euo pipefail
          if test -f Telegram/Telegram.csproj; then
            echo "Source is present; checking the existing working tree."
            exit 0
          fi

          upstream_sha="$(tr -d '\r\n' < scripts/upstream-ref.txt)"
          git fetch --no-tags --depth=1 https://github.com/UnigramDev/Unigram.git "$upstream_sha"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$upstream_sha"
          git checkout FETCH_HEAD -- .
          cp scripts/README.tglite.md README.md
          node scripts/apply-lite.mjs .
          echo "IMPORTED=1" >> "$GITHUB_ENV"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check scripts/apply-lite.mjs
          node --check scripts/verify-lite.mjs

      - name: Verify source
        run: node scripts/verify-lite.mjs .

      - name: Reproduce edits from upstream source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/unigram-source"
          mkdir -p "$source_dir"
          git -C "$source_dir" init -q
          pinned="$(tr -d '\r\n' < scripts/upstream-ref.txt)"
          git -C "$source_dir" fetch --quiet --no-tags --depth=1 https://github.com/UnigramDev/Unigram.git "$pinned"
          git -C "$source_dir" checkout --quiet FETCH_HEAD
          node scripts/apply-lite.mjs "$source_dir"
          node scripts/verify-lite.mjs "$source_dir"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate C# and XAML syntax
        shell: bash
        run: dotnet run --project scripts/SyntaxCheck/SyntaxCheck.csproj --configuration Release -- .

      - name: Compile TDLib integration tests
        shell: bash
        run: dotnet build scripts/TdlibSmoke/TdlibSmoke.csproj --configuration Release --nologo

      - name: Publish source code
        if: env.IMPORTED == '1'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check -- scripts .github/workflows README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Unigram source and personalize TGLite"
          git push origin HEAD:main
